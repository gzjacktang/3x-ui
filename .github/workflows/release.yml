name: Release 3X-UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.sh"
      - "frontend/**"
      - "x-ui.service.*"
      - "x-ui.rc"
      - ".github/workflows/release.yml"

jobs:
  build:
    name: Build Linux amd64
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build static Linux amd64 panel
        run: |
          set -euo pipefail
          CURL_RETRY="--retry 5 --retry-all-errors --retry-delay 3"
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/x86-64/tarballs/"
          TARBALL_NAME=$(curl -fsSL $CURL_RETRY "$TARBALL_BASE" | grep -oE 'x86-64--musl--stable-[^"]+\.tar\.xz' | sort -r | head -n1)
          [ -n "$TARBALL_NAME" ] || { echo "Cannot resolve the amd64 musl toolchain" >&2; exit 1; }
          toolchain_dir=$(mktemp -d)
          curl -fLsS $CURL_RETRY -o "$toolchain_dir/toolchain.tar.xz" "$TARBALL_BASE/$TARBALL_NAME"
          tar -xf "$toolchain_dir/toolchain.tar.xz" -C "$toolchain_dir"
          export CC=$(find "$toolchain_dir" -name '*-gcc.br_real' -type f -executable | head -n1)
          [ -n "$CC" ] || { echo "No musl compiler found" >&2; exit 1; }
          export PATH="$(dirname "$CC"):$PATH"
          export CGO_ENABLED=1 GOOS=linux GOARCH=amd64
          LDFLAGS="-w -s -linkmode external -extldflags '-static'"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/mhsanaei/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA::8} -X github.com/mhsanaei/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          mkdir -p x-ui/bin
          go build -ldflags "$LDFLAGS" -o x-ui/x-ui main.go
          file x-ui/x-ui
          cp x-ui.service.debian x-ui.service.arch x-ui.service.rhel x-ui.rc x-ui.sh x-ui/

      - name: Download runtime resources
        run: |
          set -euo pipefail
          CURL_RETRY="--retry 5 --retry-all-errors --retry-delay 3"
          cd x-ui/bin
          xray_url="https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip"
          curl -fL $CURL_RETRY -o Xray-linux-64.zip "$xray_url"
          curl -fL $CURL_RETRY -o Xray-linux-64.zip.dgst "$xray_url.dgst"
          expected=$(awk -F'= ' '/^SHA2-256=/ {print $2; exit}' Xray-linux-64.zip.dgst | tr -d '\r')
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Invalid Xray digest" >&2; exit 1; }
          printf '%s  %s\n' "$expected" Xray-linux-64.zip | sha256sum --check -
          unzip Xray-linux-64.zip
          rm -f Xray-linux-64.zip Xray-linux-64.zip.dgst geoip.dat geosite.dat
          mv xray xray-linux-amd64
          curl -fL $CURL_RETRY -O https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fL $CURL_RETRY -O https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          MTG_MULTI_VER=$(curl -sf $CURL_RETRY -o /dev/null -w '%{redirect_url}' https://github.com/mhsanaei/mtg-multi/releases/latest | sed -n 's#.*/releases/tag/##p')
          [ -n "$MTG_MULTI_VER" ] || { echo "Cannot resolve mtg-multi version" >&2; exit 1; }
          MTG_PKG="mtg-multi-${MTG_MULTI_VER#v}-linux-amd64"
          curl -fL $CURL_RETRY -O "https://github.com/mhsanaei/mtg-multi/releases/download/${MTG_MULTI_VER}/${MTG_PKG}.tar.gz"
          tar -xzf "${MTG_PKG}.tar.gz"
          mv "${MTG_PKG}/mtg-multi" mtg-linux-amd64
          rm -r "${MTG_PKG}" "${MTG_PKG}.tar.gz"
          chmod +x xray-linux-amd64 mtg-linux-amd64

      - name: Package with SHA-256
        run: |
          tar -zcf x-ui-linux-amd64.tar.gz x-ui
          sha256sum x-ui-linux-amd64.tar.gz > x-ui-linux-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: x-ui-linux-amd64
          path: |
            x-ui-linux-amd64.tar.gz
            x-ui-linux-amd64.tar.gz.sha256
      - name: Upload tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: x-ui-linux-amd64.tar.gz*
          file_glob: true
          overwrite: true
          prerelease: false

  publish-dev:
    name: Publish rolling dev release
    needs: [build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize racing pushes; never cancel an in-flight upload, or the dev
    # release could be left with a partial asset set.
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dev-artifacts
          merge-multiple: true

      - name: Publish dev-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -e
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $i failed: ${*:1:3}" >&2
              sleep $((i * 5))
            done
            return 1
          }
          short="${COMMIT::8}"
          notes="Linux amd64 精简版滚动构建，可在面板更新入口或安装脚本直接升级。

          commit=${COMMIT}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          内置 Xray-core 26.10.31。只提供 x-ui-linux-amd64.tar.gz 及 SHA-256 校验文件；Docker、Windows、386/ARM/s390x 不再发布。

          已选择性同步登录/会话/Web连接安全、客户端停用与续期、ENC/回落校验、旧Xray配置迁移和升级流程修复。安装包及所有面板更新入口均来自 gzjacktang/3x-ui。

          已有数据库、登录凭据、路径和证书保留；一次性会话密钥轮换后需要重新登录。升级前务必备份数据库；迁移失败会停止升级，不会自动回滚数据库。

          详细移植范围与验证记录见仓库 UPGRADE_PROGRESS.md。本构建来自main，仍是测试版，不等同于稳定版。"

          # Force-move the dev-latest tag to this commit so the release tracks it.
          git tag -f dev-latest "${COMMIT}"
          retry git push -f origin refs/tags/dev-latest

          # The release exists on every run but the first; edit-first avoids an
          # existence probe that can 503 and mis-route into create (422).
          if ! retry gh release edit dev-latest --prerelease --latest=false \
              --title "Dev build ${short}" --notes "${notes}"; then
            retry gh release create dev-latest --prerelease --latest=false \
              --target "${COMMIT}" --title "Dev build ${short}" --notes "${notes}"
          fi

          retry gh release upload dev-latest dev-artifacts/*.tar.gz dev-artifacts/*.sha256 --clobber
          # Remove stale packages for platforms this fork no longer supports.
          gh release view dev-latest --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            case "$asset" in
              x-ui-linux-amd64.tar.gz|x-ui-linux-amd64.tar.gz.sha256) ;;
              x-ui-linux-*|x-ui-windows-*) retry gh release delete-asset dev-latest "$asset" --yes ;;
            esac
          done
